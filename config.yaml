data:
  raw_path: data/raw/diabetes.csv
  processed_path: data/processed/diabetes_processed.csv
  synthetic_path: data/synthetic/diabetes_synthetic.csv
  train_test_split: 0.8
  random_state: 42
  target_column: Outcome
  rebalance_strategy: oversample_minority
  oversample_target_ratio: 1.0
  augmentation_method: smote  # Options: diffusion, smote, adasyn, none
  smote_k_neighbors: 5
  adasyn_n_neighbors: 5

preprocessing:
  handle_missing: true
  detect_outliers: false
  outlier_method: iqr
  scale_features: true
  feature_engineering: true
  zero_as_missing_columns: []

feature_selection:
  n_features_to_select: all
  correlation_threshold: 0.9
  methods: [correlation, mutual_information, rfe, xgboost_importance]

model:
  save_path: models/xgboost_model.joblib
  scaler_path: models/scaler.joblib
  feature_selector_path: models/feature_selector.joblib
  early_stopping_rounds: 10
  validation_fraction: 0.1
  use_all_features_for_final_model: false
  use_class_weight: true
  class_weight: {0: 1, 1: 3}
  calibration:
    enabled: false
    method: sigmoid

evaluation:
  plots_path: results
  save_plots: true
  validation_cv_folds: 5
  threshold_method: f1
  fixed_threshold: 0.5
  threshold_beta: 1.0
  validate_feature_selection: false
  auto_select_feature_set: true

diffusion:
  device: cpu
  num_timesteps: 100
  beta_start: 0.0001
  beta_end: 0.02
  hidden_dim: 64
  num_layers: 2
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  num_synthetic_samples: 200
  use_synthetic_augmentation: true
  generate_positive_synthetic_only: true

optimization:
  optimizer_type: optuna
  objective_metric: f1
  population_size: 15
  max_iterations: 30
  early_stopping_rounds: 8
  convergence_threshold: 0.0001
  cv_folds: 5
  repeated_cv_repeats: 1
  optuna_trials: 50
  search_space:
    max_depth: {type: int, min: 3, max: 10}
    learning_rate: {type: float, min: 0.01, max: 0.2}
    n_estimators: {type: int, min: 50, max: 500}
    gamma: {type: float, min: 0.0, max: 8.0}
    min_child_weight: {type: int, min: 1, max: 3}
    scale_pos_weight: {type: float, min: 1.0, max: 10.0}
    subsample: {type: float, min: 0.4, max: 1.0}
    colsample_bytree: {type: float, min: 0.4, max: 1.0}
    reg_alpha: {type: float, min: 0.0, max: 2.0}
    reg_lambda: {type: float, min: 0.0, max: 3.0}

explainability:
  save_path: outputs/shap
  num_samples: 200

baseline:
  models: [logistic_regression, random_forest, svm, default_xgboost]
  grid_search_cv: 5
  random_search_iterations: 20
  optuna_trials: 20

logging:
  level: INFO
  log_file: logs/diabetes_predictor.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
